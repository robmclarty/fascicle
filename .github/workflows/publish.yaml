name: Publish

# Publishes to npm with provenance when a vX.Y.Z tag is pushed. Auth is npm
# Trusted Publishing (OIDC): no token exists anywhere - the registry trusts
# this exact workflow's identity, minted per run, so there is no secret to
# leak or rotate and no 2FA bypass. Provenance links the published tarball to
# this commit and workflow run, verifiable on npmjs.com and via
# `npm audit signatures`. See SECURITY.md for the full supply-chain posture.
#
# Three jobs, so the OIDC identity never shares a job with the repo's
# dependencies. `unpublished` looks the version up on npm. `build` installs
# the dependencies, runs the gate and packs the tarball, with no way to mint a
# token. `publish` holds id-token: write and the approval gate, and runs
# nothing from the repo: it downloads that tarball and publishes it as it is,
# with scripts off. A compromised dev dependency can still fail the build, but
# it can't publish with this workflow's identity.
#
# One-time setup outside the repo:
#   - npmjs.com: package fascicle -> Settings -> Trusted Publisher ->
#     GitHub Actions, repository robmclarty/fascicle, workflow filename
#     publish.yaml, environment npm-publish.
#   - GitHub: repo Settings -> Environments -> npm-publish, with a required
#     reviewer. The run pauses there until a maintainer approves - the CI
#     equivalent of the old local MFA prompt.
#
# release.yaml (GitHub Release from the same tag) stays separate so its
# contents: write never shares a job with id-token: write.

on:
  push:
    tags: ['v[0-9]*']
  # Manual re-run hatch: a tag is immutable, so a publish that failed for a
  # reason outside the tree (auth, registry) can be retried from main - the
  # tarball contents are identical, and npm refuses an already-published
  # version.
  workflow_dispatch:

permissions:
  contents: read # checkout only

# GitHub has delivered one tag push twice (v0.12.11), starting two runs that
# both paused at the approval gate. Approving the second would fail it, since
# npm refuses a version that is already published. The group makes a
# duplicate wait for the first run to finish, and its unpublished job then
# finds the version on npm and skips the build and publish jobs before the
# gate.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unpublished:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.registry.outputs.publish }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # Anything short of a version string back from the registry (a 404, or
      # a network error) counts as unpublished, so a flaky lookup falls
      # through to the publish job, where npm itself is the final word.
      - name: Look up the version on npm
        id: registry
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ -n "$(npm view "fascicle@$VERSION" version 2> /dev/null)" ]; then
            echo "fascicle@$VERSION is already on npm, so there is nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: unpublished
    if: needs.unpublished.outputs.publish == 'true'
    runs-on: ubuntu-latest
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      # No pnpm cache here: a cache can be written by other runs, and what this
      # job packs is what gets published.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The full gate. Publishing a packed tarball runs no scripts, so
      # prepublishOnly never reruns it: this job is where it runs.
      - name: Check
        run: pnpm check

      - name: Build
        run: pnpm build

      - name: Check publish surface
        run: pnpm check:publish

      # A publish blocked by the gate is the worst place to be reading a bare
      # pass/fail line, so keep the slot output from .check/ for the postmortem.
      - name: Upload check reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publish-check-reports
          path: |
            .check/
            !.check/coverage/**
            !.check/mutation/**
          retention-days: 14

      # npm pack takes the dist/ the build step wrote, which the publish
      # surface check just passed.
      - name: Pack
        id: pack
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TARBALL="fascicle-$VERSION.tgz"
          npm pack
          test -f "$TARBALL"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"

      - name: Upload tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package
          path: ${{ steps.pack.outputs.tarball }}
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: npm-publish # required-reviewer gate: the human approval step
    permissions:
      id-token: write # OIDC identity for npm trusted publishing + provenance
    steps:
      # No registry-url here: setup-node would write an .npmrc keyed to a
      # NODE_AUTH_TOKEN env var, which shadows the tokenless OIDC flow.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      # Trusted Publishing needs npm >= 11.5.1; pin the major to be sure.
      - name: Update npm
        run: npm install -g npm@11 --ignore-scripts

      - name: Download tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package

      # npm (not pnpm) publish: the OIDC token exchange is an npm CLI flow.
      # --ignore-scripts: the build job already checked and built this
      # tarball. --provenance is redundant under trusted publishing but
      # documents intent and fails closed if the OIDC identity is ever absent.
      - name: Publish with provenance
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
        run: npm publish "./$TARBALL" --provenance --access public --ignore-scripts

id: no-kind-switch-in-runner
message: "runner.ts must not branch on step.kind. Composers own their own execution by registering via register_traced_kind(...), so the runner never special-cases a kind."
severity: error
language: typescript
files:
  - src/core/runner.ts
rule:
  any:
    - pattern: switch ($$$.kind) { $$$ }
    - pattern: |
        if ($$$.kind === $VAL) { $$$ }
    - pattern: |
        if ($$$.kind == $VAL) { $$$ }

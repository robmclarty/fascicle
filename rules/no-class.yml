id: no-class
message: Prefer functional/procedural style over classes. Use modules and closures instead. (Exception - typed errors in src/core/errors.ts, src/engine/errors.ts, src/mcp/errors.ts, src/composites/errors.ts, and src/schema/errors.ts.)
severity: error
language: typescript
files:
  - src/**/*.ts
ignores:
  - src/**/__tests__/**
  - src/core/errors.ts
  - src/engine/errors.ts
  - src/mcp/errors.ts
  - src/composites/errors.ts
  - src/schema/errors.ts
rule:
  any:
    - kind: class_declaration
    - kind: abstract_class_declaration

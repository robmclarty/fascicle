id: no-serial-accumulation
message: "Pushing an awaited value inside a loop serializes independent iterations. If the iterations are independent, collect the promises and `await Promise.all(...)` after the loop. If the sequencing is deliberate (rate limits, ordered side effects, shared mutable state), suppress with `// ast-grep-ignore: no-serial-accumulation` on the line above and a comment saying why."
severity: error
language: typescript
files:
  - src/**/*.ts
  - examples/**/*.ts
ignores:
  - "**/__tests__/**"
  - "**/*.test.ts"
rule:
  pattern: $ARR.push(await $$$)
  inside:
    any:
      - kind: for_statement
      - kind: for_in_statement
      - kind: while_statement
      - kind: do_statement
    stopBy: end

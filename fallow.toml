# Fallow: dead code, circular deps, duplication, complexity, architecture boundaries.
# Docs: https://docs.fallow.tools

entry = [
  "src/index.ts",
  "src/*/index.ts",
  "src/**/*.test.ts",
  "src/**/__tests__/**/*.mjs",
  "src/**/*-harness.ts",
  "src/viewer/cli.ts",
  "test/**/*.test.ts",
  "test/**/*.mjs",
  "stryker.config.mjs",
  # Build and check-suite entry points: run by checkride and CI as commands,
  # never imported, so nothing in the module graph reaches them.
  "scripts/*.mjs",
  # Single-file example demos: each is run directly via `pnpm exec tsx
  # examples/<name>.ts`, never imported. The subset that's stub-driven and
  # network-free is also imported by test/examples.test.ts; this glob covers
  # the rest (live CLI/HTTP/network demos that can't run in the default suite).
  "examples/*.ts",
  # amplify's chart renderer: invoked by scripts/demo.sh as a CLI, not imported.
  "examples/amplify/scripts/*.mjs",
  # amplify's pluggable metrics: resolved by name via a dynamic import built
  # from a runtime string (services/metric.ts), so no static import reaches them.
  "examples/amplify/metrics/*.ts",
  # amplify's mutable benchmark target: loaded via the IMPL_PATH env var by
  # target/bench.ts (scripts/demo.sh), never statically imported.
  "examples/amplify/target/src/*.ts",
  # amplify's target-package tests: run via its own target/vitest.config.ts,
  # outside the root vitest.config.ts include globs (scoped to src/__tests__/).
  "examples/amplify/target/tests/*.test.ts",
]

# The GitHub Pages marketing site: browser scripts loaded by <script> tags, not
# part of the published package or its module graph. Analyzing it reports every
# file as unused and its DOM handlers as complexity findings, neither of which
# is actionable.
ignorePatterns = ["site/**"]

# CLI/tooling deps used via command line or config files, not imported from source.
# `fascicle` is examples' self-reference to the workspace package via
# `workspace:*`, which fallow cannot resolve as a real import (D7). checkride's
# `attw` slot invokes `@arethetypeswrong/cli` as a CLI, never an import, same as
# publint above (D8).
ignoreDependencies = [
  "@ast-grep/cli",
  "@stryker-mutator/vitest-runner",
  "publint",
  "fascicle",
  "@arethetypeswrong/cli",
]

# `aborted_error` is defined in core and deliberately re-exported by engine so
# that `instanceof aborted_error` holds regardless of which layer surfaced it
# (src/engine/errors.ts); the engine's own modules import it from that barrel.
# The duplicate-export is that re-export contract, not a copy, so it resolves in
# config rather than the baseline (D1).
ignoreExports = [
  { file = "src/core/errors.ts", exports = ["aborted_error"] },
  { file = "src/engine/errors.ts", exports = ["aborted_error"] },
]

[rules]
unused-exports = "error"
unused-files = "error"
unused-dependencies = "error"
circular-dependencies = "error"
boundary-violation = "error"

[duplicates]
# mild (default): AST-based, catches copy-paste. semantic: catches renamed variables too.
mode = "mild"
minTokens = 50

[health]
# Per-function complexity thresholds. Tune to project.
maxCyclomatic = 15
maxCognitive = 15
# Real per-function CRAP scores from the vitest Istanbul dump, instead of
# fallow's static estimate. Requires the order-3 test slot to have run first
# (checkride's order 4 always follows it; a bare `pnpm check --only health`
# reads whatever dump is on disk, so re-run test first if a finding looks
# stale or surprising).
coverage = ".check/coverage/coverage-final.json"
# Complexity thresholds are tuned for library internals; demo, tooling, and
# test code is linear by design and its quality is guarded by the mutation
# gate and blueprint rules instead (D3, health-is-production-metric).
ignore = ["examples/**", "scripts/**", "test/**", "src/**/__tests__/**"]

# Architecture boundaries: directory-level DAG that replaces the old
# per-package manifest graph. fallow 3's schema is default-deny — each zone
# lists every sibling it MAY import (allow), the inverse of the old
# default-allow/cannotImport form, translated 1:1 to preserve behavior. The
# umbrella (src/*.ts) is intentionally unconstrained — it composes every
# layer. Mirrors the ast-grep boundary rules.

[[boundaries.zones]]
name = "core"
patterns = ["src/core/**"]

[[boundaries.zones]]
name = "engine"
patterns = ["src/engine/**"]

[[boundaries.zones]]
name = "composites"
patterns = ["src/composites/**"]

[[boundaries.zones]]
name = "adapters"
patterns = ["src/adapters/**"]

[[boundaries.zones]]
name = "viewer"
patterns = ["src/viewer/**"]

[[boundaries.zones]]
name = "agents"
patterns = ["src/agents/**"]

[[boundaries.zones]]
name = "mcp"
patterns = ["src/mcp/**"]

[[boundaries.zones]]
name = "stdio"
patterns = ["src/stdio/**"]

[[boundaries.zones]]
name = "ui"
patterns = ["src/ui/**"]

[[boundaries.zones]]
name = "otel"
patterns = ["src/otel/**"]

[[boundaries.zones]]
name = "policy"
patterns = ["src/policy/**"]

[[boundaries.zones]]
name = "schema"
patterns = ["src/schema/**"]

[[boundaries.zones]]
name = "testing"
patterns = ["src/testing/**"]

[[boundaries.rules]] # core: imports no sibling module except the policy algebra and the schema seam
from = "core"
allow = ["mcp", "stdio", "ui", "policy", "schema"]

[[boundaries.rules]] # engine: may reference core (type-only, see ast-grep), policy, and schema, nothing else
from = "engine"
allow = ["core", "mcp", "stdio", "ui", "policy", "schema"]

[[boundaries.rules]] # composites: core + adapters only
from = "composites"
allow = ["core", "adapters", "mcp", "stdio", "ui"]

[[boundaries.rules]] # adapters: core only (injected via run_context)
from = "adapters"
allow = ["core", "mcp", "stdio", "ui"]

[[boundaries.rules]] # viewer: core only (dev tool that reads the wire format)
from = "viewer"
allow = ["core", "mcp", "stdio", "ui"]

[[boundaries.rules]] # agents: core + composites + engine only
from = "agents"
allow = ["core", "engine", "composites", "mcp", "stdio", "ui", "schema"]

[[boundaries.rules]] # mcp: core + engine only (bridges flows/tools to the MCP wire)
from = "mcp"
allow = ["core", "engine", "stdio", "ui", "schema"]

[[boundaries.rules]] # stdio: core + adapters only (single-shot child-process entry helper)
from = "stdio"
allow = ["core", "adapters", "ui", "schema"]

[[boundaries.rules]] # ui: core + engine only (bridges the run stream to the AI SDK UI wire)
from = "ui"
allow = ["core", "engine", "mcp", "stdio"]

[[boundaries.rules]] # otel: core only (transport-neutral trajectory-to-OTel bridge; own subpath, C2)
from = "otel"
allow = ["core"]

[[boundaries.rules]] # policy: bottom of the DAG; core and engine import it, so it imports nothing
from = "policy"
allow = []

[[boundaries.rules]] # schema: bottom of the DAG; core, engine, mcp, stdio, and agents import it, so it imports nothing
from = "schema"
allow = []

[[boundaries.rules]] # testing: engine only, type-only (canned Engine doubles); no src module imports it back
from = "testing"
allow = ["engine"]

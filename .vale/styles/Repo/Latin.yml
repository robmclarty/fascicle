# Latin abbreviations are house style here, not a smell. Every voice exemplar
# uses `e.g.,` and `i.e.,`, and `etc.` closes a list in three of them; banning
# them put the docs at odds with the person writing them.
#
# What survives is the form, because the exemplars are unanimous about it:
# periods on both letters and a comma after. Bare `eg` and `ie` are typos for
# the same thing. `etc.`, `et al.`, and `per se` are left alone entirely.
extends: existence
message: "'%s': write `e.g.,` and `i.e.,` with both periods and the comma."
level: error
ignorecase: false
# The tokens carry periods and a lookahead, which word boundaries would break.
nonword: true
tokens:
  - '\b(?:eg|ie)[,.]?\s'
  - '\b(?:e\.g\.|i\.e\.)(?!,)'

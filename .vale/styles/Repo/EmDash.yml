# The em dash is the loudest single tell in this repo's generated prose: 229
# across docs/, and not one across the whole voice exemplar set. CLAUDE.md has
# forbidden it in code comments and docs since before this slot existed, with
# nothing enforcing that. A comma, a colon, or a full stop carries the same
# break, and the exemplars reach for all three.
#
# Warning rather than error, until the docs sweep lands. Vale exits non-zero on
# error-severity alerts alone, so this stays visible in .check/prose.json and in
# the terminal without failing a run. Raise it to `error` once docs/ and src/
# are clear, which is the point at which the rule starts holding the line.
extends: existence
message: "'%s': no em dash. Use a comma, a colon, or two sentences."
level: warning
# The token is a bare character, and word boundaries cannot wrap punctuation.
nonword: true
tokens:
  - '—'

# An em dash is a pause, and pauses are fine: comma, em dash, semicolon, full
# stop, each longer than the last. What the em dash is not is a bracket. An
# aside goes in round brackets here, without exception, and the paired em dash
# that wraps one is the construction this rule exists to catch.
#
# No voice exemplar contains one. A single em dash between two clauses is left
# alone, which is why the token needs a partner to match.
extends: existence
message: "'%s': an aside takes round brackets, not a pair of em dashes."
level: error
# The token spans punctuation and needs to match across a wrapped line, so word
# boundaries would cut it in half.
nonword: true
tokens:
  - '—[^—]{1,90}—'

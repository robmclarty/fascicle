# Semicolons are welcome; stacking them is not. One per sentence is the line the
# voice exemplars hold without exception: five semicolons across the set, never
# two in the same sentence.
#
# The rule counts rather than forbids, so a sentence that earns its semicolon
# keeps it and only the pile-ups report.
extends: occurrence
message: "More than one semicolon in a sentence. Split it, or use brackets."
level: error
scope: sentence
max: 1
token: ';'

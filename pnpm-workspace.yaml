packages:
  # The library itself is the workspace root (single package). Only the example
  # apps are separate workspace members; they depend on the root via `fascicle`.
  - 'examples/red-green-refactor'
  - 'examples/amplify'
  - 'examples/mcp-server'
  - 'examples/pr-improve'
  - 'examples/swebench'
  - 'examples/change-triage'
  - 'examples/docs-concierge'

allowBuilds:
  '@ast-grep/cli': true
  '@vvago/vale': true
  esbuild: true
  fallow: true

# The global minimumReleaseAge quarantine exists to blunt third-party registry
# compromise. These are first-party packages published from repos on this
# machine, so the quarantine buys nothing and only delays adopting a fix.
minimumReleaseAgeExclude:
  - checkride
  - fallow

# pnpm reads overrides from this file (not the package.json `pnpm` field) in a
# workspace. Every entry below lifts a transitive pin past an advisory, and
# every one of them is dev-tree only. smol-toml >=1.6.1 puts cspell and
# markdownlint-cli2 on one copy, past the advisory against 1.6.0. fast-uri
# >=4.2.3 lifts ajv's pin past the path-traversal advisory, the three high
# ones that landed against 4.1.2, among them host confusion on scheme-relative
# references and request forgery via IPv6 normalization, and the four that
# landed against 4.2.1, among them scheme spoofing through a percent-encoded
# scheme. vite ^8.0.16 clears the `server.fs.deny` bypass under vitest, capped
# at 8, the newest major vitest 5 accepts. The override replaces the root's own
# vite pin too, so moving that pin also takes a re-resolve inside the range
# (`pnpm update -r vite`).
#
# The `security` slot doesn't demand the qs entry, because all four of its
# advisories are moderate and the slot fails at high. They reach the tree
# through Stryker and through the MCP SDK's express, the SDK being an optional
# peer a consumer installs themselves, so nothing here ships. 6.16.0 cleared
# the first three (the comma-format stringify crash, the array-limit bypass,
# and the isBuffer denial of service), and 6.16.1 clears the fourth, an
# uncaught TypeError on an array element whose own `toString` can't be called.
#
# brace-expansion is scoped to its vulnerable range rather than floored, since
# older majors of it still serve other parts of the tree. Its one 5.x copy
# comes in through Stryker's minimatch, whose `^5.0.8` already admits the fix,
# but `pnpm update` won't re-resolve a lone transitive copy by name, so the
# entry lifts it past the two high advisories and the moderate one that
# followed them.
#
# undici, body-parser, and ip-address are scoped the same way, and each
# parent's own range already admits the fix. undici comes in through the AI
# SDK's provider-utils, whose `^7.29.0` takes 7.30.1, past four high
# advisories (TLS options dropped in an Agent, cache poisoning across
# cross-origin redirects, and two denials of service) and four moderate ones.
# body-parser 2.4.0 and ip-address 10.7.4 sit inside what the MCP SDK's
# express and express-rate-limit ask for, and clear a high denial of service
# on trailing bytes after a compressed body and a quadratic zone-identifier
# match. All three reach a consumer only through peers they install
# themselves, and that install resolves onto the patched releases, so these
# entries change this lockfile alone.
#
# minimatch is the one entry that crosses a major. Stryker asks for
# `~10.2.4`, and the globparts amplification advisory has no fix before
# 11.0.1, so the entry moves Stryker onto 11. Stryker calls nothing that 11
# removed (`makeRe`, `Minimatch#regexp`, and the `AST` class among it), only
# `minimatch()`, `Minimatch#match` with partial matching, and `hasMagic`.
# Retire the entry when a Stryker release asks for 11 itself.
#
# re2js arrived with markdownlint 0.42, which pins it at exactly 2.8.6, inside
# the range of a high advisory on quadratic-time lookbehind matching. The
# entry takes the smallest step past it, to the fix on the 2.8 line, rather
# than 2.9. Retire it when a markdownlint release pins 2.8.7 or later.
#
# Note what these entries cannot do. A `>=` pin is a floor, not a ceiling, so
# it clears today's advisory and says nothing about the next one inside the
# same major: fast-uri `>=3.1.2` resolved happily onto the vulnerable 4.1.2
# until the advisory landed. Only an audit catches that, and the `security`
# slot runs only when asked (`pnpm check:security`), so run it after any change
# to this file or the lockfile.
overrides:
  smol-toml: '>=1.6.1'
  fast-uri: '>=4.2.3'
  qs: '>=6.16.1'
  vite: '^8.0.16'
  'brace-expansion@>=4.0.0 <5.0.12': '^5.0.12'
  'undici@>=7.0.0 <7.30.1': '^7.30.1'
  'body-parser@>=2.0.0 <2.4.0': '^2.4.0'
  'ip-address@>=10.0.0 <10.7.4': '^10.7.4'
  'minimatch@>=10.0.0 <11.0.1': '^11.0.1'
  're2js@>=2.2.0 <2.8.7': '~2.8.7'

# Patched dependencies: fixes upstream hasn't shipped yet. Each entry names the
# issue it carries and how to tell it's done.
#
# @stryker-mutator/vitest-runner 10.0.0 builds its per-test filter by joining
# describe and test names with ' ', but vitest 5 joins them with ' > '. The
# filter then matches nothing, nearly every mutant run executes zero tests, and
# the mutants survive with no error. That's stryker-js #6210; the patch is the
# separator change from PR #6214, copied from checkride, which carries the same
# fix. Measured 2026-10-14 on src/core/pipe.ts: 2.44% unpatched on vitest 5
# (1 of 41 killed), 100% on vitest 4.
#
# Retire it when a release carries the fix: delete the entry and the patch file,
# re-install, and run stryker over that one file, outside the incremental
# record:
#   pnpm exec stryker run --mutate src/core/pipe.ts --force \
#     --incrementalFile /tmp/canary.json --reporters clear-text
# A score near 100% means the release fixed it; one near zero means it didn't.
#
# braces 3.0.3 limits a pattern's length but not its nesting, and its
# recursive walkers overflow the stack on a deeply nested one: on Node 24,
# `braces.expand` throws RangeError at a depth of 4990, inside the length
# cap (GHSA-vfj7-8cjw-p6xm, high). No release fixes it, and upstream has a
# dozen open pull requests and no merge since January 2025. The patch is
# micromatch/braces#88: the parser refuses nesting deeper than 128 and the
# walkers check depth before recursing, so such a pattern throws a
# SyntaxError instead. braces reaches the tree only through
# markdownlint-cli2's globbing, which reads patterns from this repo.
#
# Retire it when braces ships a fix: delete the entry, the patch file, and
# the `audit.ignore` line below, re-install, and run `pnpm check:security`.
patchedDependencies:
  '@stryker-mutator/vitest-runner@10.0.0': patches/@stryker-mutator__vitest-runner@10.0.0.patch
  braces@3.0.3: patches/braces@3.0.3.patch

# pnpm audit matches advisories by version, so it can't see a patch. This
# tells it the braces advisory is handled above, so `pnpm audit` passes, and
# so does checkride's `security` slot from 0.15 on. That slot counts the
# advisories that the report lists rather than its per-severity totals, which
# pnpm 11 still fills with ignored advisories.
audit:
  ignore:
    - GHSA-vfj7-8cjw-p6xm # braces 3.0.3, patched above

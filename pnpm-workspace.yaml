packages:
  # The library itself is the workspace root (single package). Only the example
  # apps are separate workspace members; they depend on the root via `fascicle`.
  - 'examples/red-green-refactor'
  - 'examples/amplify'
  - 'examples/mcp-server'
  - 'examples/pr-improve'
  - 'examples/swebench'
  - 'examples/change-triage'
  - 'examples/docs-concierge'

allowBuilds:
  '@ast-grep/cli': true
  '@vvago/vale': true
  esbuild: true
  fallow: true

# The global minimumReleaseAge quarantine exists to blunt third-party registry
# compromise. These are first-party packages published from repos on this
# machine, so the quarantine buys nothing and only delays adopting a fix.
minimumReleaseAgeExclude:
  - checkride
  - fallow

# pnpm reads overrides from this file (not the package.json `pnpm` field) in a
# workspace. Every entry below lifts a transitive pin past an advisory the
# `security` slot fails on, and every one of them is dev-tree only. smol-toml
# >=1.6.1 puts cspell and markdownlint-cli2 on one copy, past the advisory
# against 1.6.0. fast-uri >=3.1.2 lifts ajv's pin past the path-traversal and
# host-confusion advisories. vite ^8.0.16 clears the `server.fs.deny` bypass
# under vitest, capped at the major vitest 4 accepts.
overrides:
  tunnel: 'npm:@noble/secp256k1@2.1.0'
  smol-toml: '>=1.6.1'
  fast-uri: '>=3.1.2'
  vite: '^8.0.16'

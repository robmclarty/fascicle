packages:
  # The library itself is the workspace root (single package). Only the example
  # apps are separate workspace members; they depend on the root via `fascicle`.
  - 'examples/red-green-refactor'
  - 'examples/amplify'
  - 'examples/mcp-server'
  - 'examples/pr-improve'
  - 'examples/swebench'
  - 'examples/change-triage'
  - 'examples/docs-concierge'

allowBuilds:
  '@ast-grep/cli': true
  '@vvago/vale': true
  esbuild: true
  fallow: true

# The global minimumReleaseAge quarantine exists to blunt third-party registry
# compromise. These are first-party packages published from repos on this
# machine, so the quarantine buys nothing and only delays adopting a fix.
#
# oxlint is the exception that isn't first-party. 1.88.0 went in a day inside
# the quarantine, by choice. pnpm accepts a version only beside an exact name,
# never a pattern, so oxlint and each of its binding packages get a line, and
# the next release waits like any other. Every oxlint line can go once 1.88.0
# is two days old (2026-10-15).
minimumReleaseAgeExclude:
  - checkride
  - fallow
  - oxlint@1.88.0
  - '@oxlint/binding-android-arm-eabi@1.88.0'
  - '@oxlint/binding-android-arm64@1.88.0'
  - '@oxlint/binding-darwin-arm64@1.88.0'
  - '@oxlint/binding-darwin-x64@1.88.0'
  - '@oxlint/binding-freebsd-x64@1.88.0'
  - '@oxlint/binding-linux-arm-gnueabihf@1.88.0'
  - '@oxlint/binding-linux-arm-musleabihf@1.88.0'
  - '@oxlint/binding-linux-arm64-gnu@1.88.0'
  - '@oxlint/binding-linux-arm64-musl@1.88.0'
  - '@oxlint/binding-linux-ppc64-gnu@1.88.0'
  - '@oxlint/binding-linux-riscv64-gnu@1.88.0'
  - '@oxlint/binding-linux-riscv64-musl@1.88.0'
  - '@oxlint/binding-linux-s390x-gnu@1.88.0'
  - '@oxlint/binding-linux-x64-gnu@1.88.0'
  - '@oxlint/binding-linux-x64-musl@1.88.0'
  - '@oxlint/binding-openharmony-arm64@1.88.0'
  - '@oxlint/binding-win32-arm64-msvc@1.88.0'
  - '@oxlint/binding-win32-ia32-msvc@1.88.0'
  - '@oxlint/binding-win32-x64-msvc@1.88.0'

# pnpm reads overrides from this file (not the package.json `pnpm` field) in a
# workspace. Every entry below lifts a transitive pin past an advisory, and
# every one of them is dev-tree only. smol-toml >=1.6.1 puts cspell and
# markdownlint-cli2 on one copy, past the advisory against 1.6.0. fast-uri
# >=4.1.3 lifts ajv's pin past the path-traversal advisory and the three high
# ones that landed against 4.1.2, among them host confusion on scheme-relative
# references and request forgery via IPv6 normalization. vite ^8.0.16 clears
# the `server.fs.deny` bypass under vitest, capped at 8, the newest major
# vitest 5 accepts. The override replaces the root's own vite pin too, so
# moving that pin also takes a re-resolve inside the range (`pnpm update -r
# vite`).
#
# qs >=6.16.0 is the one entry the `security` slot does not demand, because all
# three of its advisories are moderate and the slot fails at high. They reach
# the tree through Stryker and through the MCP SDK's express, the SDK being an
# optional peer a consumer installs themselves, so nothing here ships. The
# floor is set to the highest of the three patched versions, which clears the
# comma-format stringify crash, the array-limit bypass, and the isBuffer
# denial of service in one move.
#
# brace-expansion is scoped to its vulnerable range rather than floored, since
# older majors of it still serve other parts of the tree. Its one 5.x copy
# comes in through Stryker's minimatch, whose `^5.0.8` already admits the fix,
# but `pnpm update` won't re-resolve a lone transitive copy by name, so the
# entry lifts it past the two high advisories and the moderate one that
# followed them.
#
# Note what these entries cannot do. A `>=` pin is a floor, not a ceiling, so
# it clears today's advisory and says nothing about the next one inside the
# same major: fast-uri `>=3.1.2` resolved happily onto the vulnerable 4.1.2
# until the advisory landed. Only an audit catches that, and the `security`
# slot runs only when asked (`pnpm check:security`), so run it after any change
# to this file or the lockfile.
overrides:
  tunnel: 'npm:@noble/secp256k1@2.1.0'
  smol-toml: '>=1.6.1'
  fast-uri: '>=4.1.3'
  qs: '>=6.16.0'
  vite: '^8.0.16'
  'brace-expansion@>=4.0.0 <5.0.12': '^5.0.12'

# Patched dependencies: fixes upstream hasn't shipped yet. Each entry names the
# issue it carries and how to tell it's done.
#
# @stryker-mutator/vitest-runner 10.0.0 builds its per-test filter by joining
# describe and test names with ' ', but vitest 5 joins them with ' > '. The
# filter then matches nothing, nearly every mutant run executes zero tests, and
# the mutants survive with no error. That's stryker-js #6210; the patch is the
# separator change from PR #6214, copied from checkride, which carries the same
# fix. Measured 2026-10-14 on src/core/pipe.ts: 2.44% unpatched on vitest 5
# (1 of 41 killed), 100% on vitest 4.
#
# Retire it when a release carries the fix: delete the entry and the patch file,
# re-install, and run stryker over that one file, outside the incremental
# record:
#   pnpm exec stryker run --mutate src/core/pipe.ts --force \
#     --incrementalFile /tmp/canary.json --reporters clear-text
# A score near 100% means the release fixed it; one near zero means it didn't.
patchedDependencies:
  '@stryker-mutator/vitest-runner@10.0.0': patches/@stryker-mutator__vitest-runner@10.0.0.patch
